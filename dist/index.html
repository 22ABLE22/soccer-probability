<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>足球计算器</title>
<style>
  /* ---- 主题变量：dark / light 两套，auto 跟随系统 ---- */
  :root{
    --radius:10px;
    --accent:#3ea6ff;
    --green:#3ddc84;
    --yellow:#ffcc00;
    --red:#ff5c5c;
  }

  /* 夜间 */
  html[data-theme="dark"]{
    --bg:#0f1216; --panel:#171b21; --panel2:#1d232b; --line:#2a323d;
    --fg:#e6e9ef; --dim:#8b95a5; --zero:#4a525e;
    --header-grad:linear-gradient(180deg,#161b22,#0f1216);
    --hover:#1b2129; --fill-op:.28; --tag-bg:#243040; --tag-fg:#9fc4e8;
    --btn-fg:#04121f; --shadow:none;
    color-scheme:dark;
  }

  /* 日间 */
  html[data-theme="light"]{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#dfe3e8;
    --fg:#1c2128; --dim:#5b6672; --zero:#b3bac2;
    --header-grad:linear-gradient(180deg,#ffffff,#f6f7f9);
    --hover:#f3f5f8; --fill-op:.22; --tag-bg:#e3edf9; --tag-fg:#2e6ca8;
    --btn-fg:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.05);
    color-scheme:light;
  }

  /* 自动：跟随系统 */
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#0f1216; --panel:#171b21; --panel2:#1d232b; --line:#2a323d;
      --fg:#e6e9ef; --dim:#8b95a5; --zero:#4a525e;
      --header-grad:linear-gradient(180deg,#161b22,#0f1216);
      --hover:#1b2129; --fill-op:.28; --tag-bg:#243040; --tag-fg:#9fc4e8;
      --btn-fg:#04121f; --shadow:none;
      color-scheme:dark;
    }
  }
  @media (prefers-color-scheme: light){
    html[data-theme="auto"]{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#dfe3e8;
      --fg:#1c2128; --dim:#5b6672; --zero:#b3bac2;
      --header-grad:linear-gradient(180deg,#ffffff,#f6f7f9);
      --hover:#f3f5f8; --fill-op:.22; --tag-bg:#e3edf9; --tag-fg:#2e6ca8;
      --btn-fg:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.05);
      color-scheme:light;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--header-grad);
  }
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12.5px}
  main{padding:18px 22px 60px;max-width:1400px;margin:0 auto;min-height:calc(100vh - 200px)}
  #status.hint.empty{padding:46px 14px;text-align:center;font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel);margin-top:4px}
  .bar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;
  }
  label{color:var(--dim);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
  select,input{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;font-size:13px;font-family:inherit;min-width:110px;
  }
  input[type=number]{width:110px}
  button{
    background:var(--accent);color:var(--btn-fg);border:0;border-radius:7px;
    padding:8px 16px;font-weight:650;font-size:13px;cursor:pointer;font-family:inherit;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:progress}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
  }
  .card h2{
    margin:0;padding:11px 14px;font-size:13.5px;font-weight:650;
    border-bottom:1px solid var(--line);background:var(--panel2);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .card h2 .meta{color:var(--dim);font-weight:400;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;text-align:right;white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:11.5px;text-transform:uppercase;
     letter-spacing:.4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2)}
  td:first-child,th:first-child{text-align:left}
  td.name,th.name{text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--hover)}
  .rank{color:var(--dim);width:34px;display:inline-block}
  .bar-cell{position:relative;min-width:86px}
  .bar-cell .fill{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:16px;border-radius:3px;opacity:var(--fill-op);z-index:0;
  }
  .bar-cell .v{position:relative;z-index:1}
  .p-high{color:var(--green)} .p-mid{color:var(--yellow)} .p-low{color:var(--dim)} .p-zero{color:var(--zero)}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--tag-bg);color:var(--tag-fg)}
  .hint{color:var(--dim);font-size:12px;padding:10px 14px;line-height:1.6}
  .hint.warn{color:var(--yellow)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>*{flex:1;min-width:260px}
  .err{color:var(--red);padding:12px 14px;font-size:13px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
        border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  #whatifList{display:flex;flex-direction:column;gap:6px;padding:10px 14px}
  .wf{display:flex;gap:8px;align-items:center;font-size:12.5px}
  .wf select,.wf input{min-width:0;flex:1}
  .wf .del{background:transparent;color:var(--red);border:0;cursor:pointer;font-size:15px;padding:0 4px}
  footer{color:var(--dim);font-size:12px;padding:20px 22px;text-align:center;border-top:1px solid var(--line)}
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  footer a:hover{color:var(--accent);border-bottom-color:currentColor}
  a{color:var(--accent)}

  /* ---- 主题切换按钮 ---- */
  .theme-btn{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    background:transparent;color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:500;
    cursor:pointer;font-family:inherit;line-height:1;
  }
  .theme-btn:hover{background:var(--hover);filter:none}
  .theme-btn .ico{font-size:13px;line-height:1}
  .theme-btn .lbl{min-width:3em;text-align:left}
  /* 防止主题切换时闪白 */
  html{background:var(--bg)}
  body{transition:background-color .15s ease,color .15s ease}
</style>
</head>
<body>
<header>
  <h1>⚽ 足球计算器</h1>
  <button id="themeBtn" class="theme-btn" type="button" title="切换主题（自动 → 夜间 → 日间）">
    <span class="ico" id="themeIco">◐</span><span class="lbl" id="themeLbl">自动</span>
  </button>
</header>

<main>
  <div class="bar">
    <label>联赛
      <select id="leagueSel">
        <option value="">— 请选择 —</option>
      </select>
    </label>
    <label>截至轮次
      <select id="roundSel">
        <option value="">— 先选联赛 —</option>
      </select>
    </label>
    <label>模拟次数
      <select id="iterSel">
        <option value="10000">10,000</option>
        <option value="50000" selected>50,000</option>
        <option value="200000">200,000</option>
        <option value="500000">500,000</option>
      </select>
    </label>
    <label>数据源
      <select id="srcSel">
        <option value="bundled">内置快照（离线可用）</option>
        <option value="live">获取最新数据</option>
      </select>
    </label>
    <label>&nbsp;
      <button id="runBtn">开始计算</button>
    </label>
    <label>&nbsp;
      <button id="addWfBtn" class="ghost">+ what-if</button>
    </label>
  </div>

  <div class="card" id="wfCard" style="display:none;margin-bottom:16px">
    <h2>what-if：强制指定某些比赛结果 <span class="meta">留空的比赛按模型模拟</span></h2>
    <div id="whatifList"></div>
  </div>

  <div id="status" class="hint">选择联赛后点击「开始计算」。</div>
  <div id="dataNote" class="hint" style="display:none;padding-top:0"></div>

  <div class="grid" id="out" style="display:none">
    <div class="card">
      <h2>当前积分榜 <span class="meta" id="tableMeta"></span></h2>
      <div style="overflow:auto;max-height:760px"><table id="curTable"></table></div>
    </div>

    <div class="card">
      <h2>概率预测 <span class="meta" id="probMeta"></span></h2>
      <div style="overflow:auto"><table id="probTable"></table></div>
      <div class="hint" id="probHint"></div>
    </div>

    <div class="row">
      <div class="card">
        <h2>名次分布（前 8 名）</h2>
        <div style="overflow:auto"><table id="posTable"></table></div>
      </div>
      <div class="card">
        <h2>模型参数</h2>
        <div class="hint" id="modelInfo"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <a href="https://github.com/22ABLE22" target="_blank" rel="noopener">GitHub @22ABLE22</a>
</footer>

<script>
/*!
 * soccer-probability-engine v1.0.0
 * 通用足球联赛概率引擎：夺冠 / 升级 / 附加赛 / 保级 / 任意名次区间
 *
 * 纯 ES2019，零依赖，Node 与浏览器通用（UMD）。
 *
 * 模型
 *   1. 由已赛比赛估计攻防强度（带收缩的正则化比率估计）
 *   2. 主场优势由数据估计（可覆盖）
 *   3. 每场剩余比赛用双泊松(Poisson)独立进球假设生成比分
 *   4. 蒙特卡洛重复整个剩余赛程，按可配置的排名规则（含小联赛内部相互战绩）排名
 *   5. 汇总每个名次/名次区间的概率
 *
 * 另附：数学上的"理论可能/已淘汰"边界（精确穷举 or 松弛上下界）
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else if (typeof define === 'function' && define.amd) define([], factory);
  else root.SoccerEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const VERSION = '1.0.0';

  /* ------------------------------------------------------------------ *
   * 随机数：可复现的 xorshift128+ （同一 seed 结果完全一致）
   * ------------------------------------------------------------------ */
  function makeRng(seed) {
    let s0 = 0x9e3779b9, s1 = 0x243f6a88, s2 = 0xb7e15162, s3 = 0xdeadbeef;
    const str = String(seed == null ? Date.now() : seed);
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    s0 = h || 1;
    s1 = (h ^ 0x9e3779b9) >>> 0 || 2;
    s2 = (h ^ 0x85ebca6b) >>> 0 || 3;
    s3 = (h ^ 0xc2b2ae35) >>> 0 || 4;
    function next() {
      // xorshift128+
      let t = s0 ^ (s0 << 11);
      s0 = s1; s1 = s2; s2 = s3;
      s3 = (s3 ^ (s3 >>> 19)) ^ (t ^ (t >>> 8));
      return (s3 >>> 0) / 4294967296;
    }
    // 预热，避免低位质量的初始相关性
    for (let i = 0; i < 20; i++) next();
    return next;
  }

  /* ------------------------------------------------------------------ *
   * 泊松分布工具
   * ------------------------------------------------------------------ */
  const MAX_GOALS = 16;

  function poissonPmf(lambda) {
    const out = new Float64Array(MAX_GOALS + 1);
    let p = Math.exp(-lambda);
    out[0] = p;
    for (let k = 1; k <= MAX_GOALS; k++) {
      p = p * lambda / k;
      out[k] = p;
    }
    return out;
  }

  /** 累积分布，最后一项归一到 1，保证采样总能命中 */
  function poissonCdf(lambda) {
    const pmf = poissonPmf(lambda);
    const cdf = new Float64Array(MAX_GOALS + 1);
    let acc = 0;
    for (let k = 0; k <= MAX_GOALS; k++) { acc += pmf[k]; cdf[k] = acc; }
    const s = acc || 1;
    for (let k = 0; k <= MAX_GOALS; k++) cdf[k] /= s;
    return cdf;
  }

  /** 依据 CDF 采样进球数（线性扫描，lambda 小时非常快） */
  function sampleGoals(cdf, u) {
    for (let k = 0; k <= MAX_GOALS; k++) if (u <= cdf[k]) return k;
    return MAX_GOALS;
  }

  /** 双泊松下单场积分期望与胜平负（用于模型校准诊断） */
  function matchProbabilities(lh, la) {
    const ph = poissonPmf(lh), pa = poissonPmf(la);
    let home = 0, draw = 0, away = 0;
    for (let i = 0; i <= MAX_GOALS; i++) {
      for (let j = 0; j <= MAX_GOALS; j++) {
        const p = ph[i] * pa[j];
        if (i > j) home += p; else if (i === j) draw += p; else away += p;
      }
    }
    const total = home + draw + away || 1;
    return { home: home / total, draw: draw / total, away: away / total };
  }

  /* ------------------------------------------------------------------ *
   * 阵容 / 赛程校验与规范化
   * ------------------------------------------------------------------ */
  const DEFAULT_POINTS = { win: 3, draw: 1, loss: 0 };
  const DEFAULT_TIEBREAK = ['points', 'gd', 'gf', 'wins'];
  const KNOWN_RULES = new Set([
    'points', 'gd', 'gf', 'wins', 'losses', 'played',
    'h2hPoints', 'h2hGd', 'h2hGf', 'h2hWins', 'h2hAwayGoals',
    'name', 'seed', 'random'
  ]);

  function normalizeLeague(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('league config must be an object');
    const teams = Array.isArray(raw.teams) ? raw.teams : null;
    if (!teams || teams.length < 2) throw new Error('league.teams must contain >= 2 teams');

    const teamList = [];
    const byId = new Map();
    teams.forEach((t, i) => {
      const item = typeof t === 'string' ? { id: t, name: t } : t;
      const id = item.id != null ? String(item.id) : String(item.name || i);
      if (byId.has(id)) throw new Error('duplicate team id: ' + id);
      const team = {
        id,
        name: item.name != null ? String(item.name) : id,
        index: i,
        deduction: Number(item.deduction || 0)   // 罚分（正数表示扣分）
      };
      teamList.push(team);
      byId.set(id, team);
    });

    const matches = (Array.isArray(raw.matches) ? raw.matches : []).map((m, i) => {
      const home = byId.get(String(m.home));
      const away = byId.get(String(m.away));
      if (!home) throw new Error('match #' + i + ' unknown home team: ' + m.home);
      if (!away) throw new Error('match #' + i + ' unknown away team: ' + m.away);
      if (home === away) throw new Error('match #' + i + ' team plays itself: ' + home.id);
      const played = m.played === true ||
        (m.homeGoals != null && m.awayGoals != null && m.played !== false);
      return {
        id: m.id != null ? String(m.id) : 'm' + i,
        round: m.round != null ? Number(m.round) : null,
        date: m.date || null,
        home: home.id,
        away: away.id,
        homeIndex: home.index,
        awayIndex: away.index,
        played,
        homeGoals: played ? Number(m.homeGoals) : null,
        awayGoals: played ? Number(m.awayGoals) : null
      };
    });

    const tiebreak = (raw.tiebreak || DEFAULT_TIEBREAK).map(String);
    for (const r of tiebreak) {
      if (!KNOWN_RULES.has(r)) throw new Error('unknown tiebreak rule: ' + r);
    }

    const slots = normalizeSlots(raw.slots, teamList.length);

    return {
      id: raw.id != null ? String(raw.id) : 'league',
      name: raw.name || 'Unnamed league',
      season: raw.season != null ? String(raw.season) : '',
      teams: teamList,
      teamById: byId,
      matches,
      points: Object.assign({}, DEFAULT_POINTS, raw.points || {}),
      tiebreak,
      slots,
      model: Object.assign({}, raw.model || {}),
      meta: raw.meta || {}
    };
  }

  /**
   * slots 定义名次区间对应的结果，例如
   *   [{ from: 1, to: 1, type: 'title', label: '冠军' },
   *    { from: 1, to: 2, type: 'promotion', label: '直接升级' },
   *    { from: 3, to: 6, type: 'playoff', label: '附加赛' },
   *    { from: 18, to: 20, type: 'relegation', label: '降级' }]
   * type 可任意自定义字符串。
   */
  function normalizeSlots(rawSlots, nTeams) {
    if (!rawSlots || !rawSlots.length) {
      return [{ from: 1, to: 1, type: 'title', label: '冠军' }];
    }
    return rawSlots.map((s, i) => {
      const from = Math.max(1, Number(s.from));
      const to = Math.min(nTeams, Number(s.to == null ? s.from : s.to));
      if (!(from <= to)) throw new Error('slot #' + i + ' has from > to');
      return {
        from,
        to,
        type: String(s.type || 'slot' + i),
        label: s.label || String(s.type || 'slot' + i),
        color: s.color || null
      };
    });
  }

  /* ------------------------------------------------------------------ *
   * 积分榜
   * ------------------------------------------------------------------ */
  function emptyStats(league) {
    const n = league.teams.length;
    return {
      played: new Int32Array(n),
      wins: new Int32Array(n),
      draws: new Int32Array(n),
      losses: new Int32Array(n),
      gf: new Int32Array(n),
      ga: new Int32Array(n),
      points: new Float64Array(n)
    };
  }

  function applyMatch(stats, league, m) {
    const P = league.points;
    const h = m.homeIndex, a = m.awayIndex;
    const hg = m.homeGoals, ag = m.awayGoals;
    stats.played[h]++; stats.played[a]++;
    stats.gf[h] += hg; stats.ga[h] += ag;
    stats.gf[a] += ag; stats.ga[a] += hg;
    if (hg > ag) {
      stats.wins[h]++; stats.losses[a]++;
      stats.points[h] += P.win; stats.points[a] += P.loss;
    } else if (hg === ag) {
      stats.draws[h]++; stats.draws[a]++;
      stats.points[h] += P.draw; stats.points[a] += P.draw;
    } else {
      stats.wins[a]++; stats.losses[h]++;
      stats.points[a] += P.win; stats.points[h] += P.loss;
    }
  }

  function computeStats(league, opts) {
    const o = opts || {};
    const stats = emptyStats(league);
    for (const m of league.matches) {
      if (!m.played) continue;
      if (o.asOfRound != null && m.round != null && m.round > o.asOfRound) continue;
      applyMatch(stats, league, m);
    }
    for (const t of league.teams) {
      if (t.deduction) stats.points[t.index] -= t.deduction;
    }
    return stats;
  }

  function remainingMatches(league, opts) {
    const o = opts || {};
    return league.matches.filter(m => {
      if (m.played && !o.includePlayed) return false;
      if (o.asOfRound != null && m.round != null && m.round > o.asOfRound) return false;
      return true;
    });
  }

  /* ------------------------------------------------------------------ *
   * 相互战绩（小联赛）
   * ------------------------------------------------------------------ */
  function buildPairResults(matches) {
    // key "i|j" -> { gf: i 视角进球, ga: i 视角失球 }
    const map = new Map();
    const key = (a, b) => a + '|' + b;
    for (const m of matches) {
      if (!m.played) continue;
      const h = m.homeIndex, a = m.awayIndex;
      if (!map.has(key(h, a))) map.set(key(h, a), { gf: 0, ga: 0 });
      if (!map.has(key(a, h))) map.set(key(a, h), { gf: 0, ga: 0 });
      const x = map.get(key(h, a));
      x.gf += m.homeGoals; x.ga += m.awayGoals;
      const y = map.get(key(a, h));
      y.gf += m.awayGoals; y.ga += m.homeGoals;
    }
    return map;
  }

  function miniTable(groupIdx, pairMap, league) {
    const P = league.points;
    const n = league.teams.length;
    const pts = new Float64Array(n), gf = new Float64Array(n), ga = new Float64Array(n),
      w = new Float64Array(n), d = new Float64Array(n), l = new Float64Array(n);
    const inGroup = new Set(groupIdx);
    for (const i of groupIdx) {
      for (const j of groupIdx) {
        if (i === j) continue;
        const r = pairMap.get(i + '|' + j);
        if (!r) continue;
        gf[i] += r.gf; ga[i] += r.ga;
        if (r.gf > r.ga) { pts[i] += P.win; w[i]++; l[j]++; }
        else if (r.gf === r.ga) { pts[i] += P.draw; d[i]++; }
        else { pts[i] += P.loss; }
      }
    }
    void inGroup;
    return { pts, gf, ga, gd: gdOf(gf, ga), w, d, l };
  }

  function gdOf(gf, ga) {
    const n = gf.length;
    const out = new Float64Array(n);
    for (let i = 0; i < n; i++) out[i] = gf[i] - ga[i];
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 排名（递归分组，支持任意顺序的 tiebreak 规则）
   * ------------------------------------------------------------------ */
  function ruleKey(rule, t, ctx) {
    const { stats, mini, nameOf, seedOf } = ctx;
    switch (rule) {
      case 'points': return stats.points[t];
      case 'gd': return stats.gf[t] - stats.ga[t];
      case 'gf': return stats.gf[t];
      case 'wins': return stats.wins[t];
      case 'losses': return -stats.losses[t];
      case 'played': return -stats.played[t];
      case 'h2hPoints': return mini ? mini.pts[t] : 0;
      case 'h2hGd': return mini ? mini.gd[t] : 0;
      case 'h2hGf': return mini ? mini.gf[t] : 0;
      case 'h2hWins': return mini ? mini.w[t] : 0;
      case 'h2hAwayGoals': return mini ? mini.gf[t] : 0;
      default: return 0;
    }
  }

  function rankGroup(group, rules, ctx) {
    if (group.length <= 1) return group.slice();
    if (!rules.length) {
      // 兜底：按队名稳定排序，保证结果可复现
      return group.slice().sort((a, b) => String(nameOf(ctx, a)).localeCompare(String(nameOf(ctx, b))));
    }
    const rule = rules[0];
    const rest = rules.slice(1);

    if (rule === 'name' || rule === 'seed' || rule === 'random') {
      const keyed = group.slice().sort((a, b) => {
        if (rule === 'name') return String(nameOf(ctx, a)).localeCompare(String(nameOf(ctx, b)));
        if (rule === 'seed') return seedOf(ctx, a) - seedOf(ctx, b);
        return (ctx.rng ? ctx.rng() : 0) - 0.5;
      });
      return keyed;
    }

    const isH2h = rule.indexOf('h2h') === 0;
    const mini = isH2h ? miniTable(group, ctx.pairMap, ctx.league) : null;
    const local = { stats: ctx.stats, mini, nameOf: ctx.nameOf, seedOf: ctx.seedOf };

    const buckets = new Map();
    for (const t of group) {
      const k = ruleKey(rule, t, local);
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(t);
    }
    const keys = Array.from(buckets.keys()).sort((x, y) => (y > x ? 1 : y < x ? -1 : 0));
    const out = [];
    for (const k of keys) {
      const sub = buckets.get(k);
      if (sub.length === 1) out.push(sub[0]);
      else out.push.apply(out, rankGroup(sub, rest, ctx));
    }
    return out;
  }

  function nameOf(ctx, i) {
    const t = ctx.league.teams[i];
    return t ? t.name : String(i);
  }
  function seedOf(ctx, i) {
    const t = ctx.league.teams[i];
    return t ? t.index : i;
  }

  /** 返回排好序的 team index 数组 */
  function rankTeams(stats, league, pairMap, matches, rng) {
    const n = league.teams.length;
    const all = [];
    for (let i = 0; i < n; i++) all.push(i);
    const flatRules = league.tiebreak.filter(r => r !== 'points');
    const ctx = {
      stats, league,
      pairMap: pairMap || buildPairResults(matches || []),
      nameOf, seedOf, rng
    };
    return rankGroup(all, ['points'].concat(flatRules), ctx);
  }

  /* ------------------------------------------------------------------ *
   * 攻防强度估计 + 主场优势
   * ------------------------------------------------------------------ */
  function estimateModel(league, opts) {
    const o = opts || {};
    const stats = computeStats(league, o);
    const n = league.teams.length;
    const cfg = league.model || {};

    let totalGF = 0, totalPlayed = 0, homeGF = 0, awayGF = 0;
    for (const m of league.matches) {
      if (!m.played) continue;
      if (o.asOfRound != null && m.round != null && m.round > o.asOfRound) continue;
      totalGF += m.homeGoals + m.awayGoals;
      totalPlayed += 2;
      homeGF += m.homeGoals;
      awayGF += m.awayGoals;
    }

    const globalAvg = totalPlayed > 0 ? totalGF / totalPlayed : 1.35;   // 每队每场
    const shrink = cfg.shrink != null ? Number(cfg.shrink) : 6;         // 收缩强度（等效场次）

    // 主场优势：使 预测主场进球/客场进球 = 观测比值
    let homeAdv = cfg.homeAdvantage != null ? Number(cfg.homeAdvantage) : null;
    if (homeAdv == null) {
      if (homeGF > 0 && awayGF > 0) {
        homeAdv = Math.sqrt((homeGF / awayGF));
        homeAdv = Math.min(1.60, Math.max(1.00, homeAdv));
      } else {
        homeAdv = 1.15;
      }
    }

    const attack = new Float64Array(n);
    const defence = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const p = stats.played[i];
      const w = p / (p + shrink);                 // 0 -> 1，样本越多越信任
      const attRaw = p > 0 ? (stats.gf[i] / p) / globalAvg : 1;
      const defRaw = p > 0 ? (stats.ga[i] / p) / globalAvg : 1;
      attack[i] = w * attRaw + (1 - w) * 1;
      defence[i] = w * defRaw + (1 - w) * 1;
      if (cfg.attack && cfg.attack[league.teams[i].id] != null) attack[i] = Number(cfg.attack[league.teams[i].id]);
      if (cfg.defence && cfg.defence[league.teams[i].id] != null) defence[i] = Number(cfg.defence[league.teams[i].id]);
    }

    return {
      globalAvg, homeAdv,
      awayFactor: 1 / homeAdv,
      attack, defence,
      shrink,
      stats,
      totalMatches: totalPlayed / 2
    };
  }

  function fixtureLambdas(model, m) {
    const lh = model.globalAvg * model.homeAdv * model.attack[m.homeIndex] * model.defence[m.awayIndex];
    const la = model.globalAvg * model.awayFactor * model.attack[m.awayIndex] * model.defence[m.homeIndex];
    return [
      Math.max(0.05, Math.min(8, lh)),
      Math.max(0.05, Math.min(8, la))
    ];
  }

  /* ------------------------------------------------------------------ *
   * 蒙特卡洛模拟
   * ------------------------------------------------------------------ */
  /**
   * @param {object} league  normalizeLeague 的产物
   * @param {object} opts
   *   iterations  模拟次数，默认 50000
   *   seed        随机种子，默认固定字符串，便于复现
   *   asOfRound   只使用 <= 该轮的已赛比赛，其余全部按模型模拟
   *   whatIf      [{matchId|home+away, homeGoals, awayGoals}] 强行指定某些"未赛"比赛的比分
   *   model       覆盖模型参数
   */
  function simulate(league, opts) {
    const o = opts || {};
    const iterations = Math.max(1, Math.floor(o.iterations != null ? o.iterations : 50000));
    const asOfRound = o.asOfRound != null ? Number(o.asOfRound) : null;

    const model = estimateModel(league, { asOfRound });
    if (o.model) {
      if (o.model.homeAdvantage != null) {
        model.homeAdv = Number(o.model.homeAdvantage);
        model.awayFactor = 1 / model.homeAdv;
      }
      if (o.model.globalAvg != null) model.globalAvg = Number(o.model.globalAvg);
      if (o.model.attack) for (const k of Object.keys(o.model.attack))
        if (league.teamById.has(k)) model.attack[league.teamById.get(k).index] = Number(o.model.attack[k]);
      if (o.model.defence) for (const k of Object.keys(o.model.defence))
        if (league.teamById.has(k)) model.defence[league.teamById.get(k).index] = Number(o.model.defence[k]);
    }

    // 已赛比赛：≤asOfRound 的真实结果 + whatIf 覆盖
    const playedMatches = [];
    const forced = new Map();
    if (o.whatIf) {
      for (const w of o.whatIf) {
        const idx = league.matches.findIndex(m =>
          (w.matchId != null && m.id === String(w.matchId)) ||
          (w.home != null && w.away != null &&
            league.teamById.has(String(w.home)) && league.teamById.has(String(w.away)) &&
            m.home === String(w.home) && m.away === String(w.away)));
        if (idx < 0) throw new Error('whatIf: match not found: ' + JSON.stringify(w));
        forced.set(idx, { hg: Number(w.homeGoals), ag: Number(w.awayGoals) });
      }
    }

    const pending = [];   // {homeIndex, awayIndex, cdfH, cdfA}
    for (let i = 0; i < league.matches.length; i++) {
      const m = league.matches[i];
      if (asOfRound != null && m.round != null && m.round > asOfRound) {
        const f = forced.get(i);
        if (f) {
          pending.push({
            homeIndex: m.homeIndex, awayIndex: m.awayIndex,
            fixed: true, hg: f.hg, ag: f.ag, cdfH: null, cdfA: null
          });
        } else {
          const [lh, la] = fixtureLambdas(model, m);
          pending.push({
            homeIndex: m.homeIndex, awayIndex: m.awayIndex, fixed: false,
            cdfH: poissonCdf(lh), cdfA: poissonCdf(la), lh, la
          });
        }
        continue;
      }
      const f = forced.get(i);
      if (f) {
        playedMatches.push({
          homeIndex: m.homeIndex, awayIndex: m.awayIndex,
          homeGoals: f.hg, awayGoals: f.ag, played: true
        });
      } else if (m.played) {
        playedMatches.push(m);
      } else {
        const [lh, la] = fixtureLambdas(model, m);
        pending.push({
          homeIndex: m.homeIndex, awayIndex: m.awayIndex, fixed: false,
          cdfH: poissonCdf(lh), cdfA: poissonCdf(la), lh, la
        });
      }
    }

    const n = league.teams.length;
    const base = emptyStats(league);
    for (const m of playedMatches) applyMatch(base, league, m);
    for (const t of league.teams) if (t.deduction) base.points[t.index] -= t.deduction;

    // 统计容器
    const positionCounts = [];   // positionCounts[t][pos] = 次数
    for (let i = 0; i < n; i++) positionCounts.push(new Float64Array(n + 1));
    const pointsSum = new Float64Array(n);
    const posSum = new Float64Array(n);

    const rng = makeRng(o.seed != null ? o.seed : 'soccer-engine-v1');
    const points = new Float64Array(n);
    const gf = new Int32Array(n), ga = new Int32Array(n), wins = new Int32Array(n);
    const playedCnt = new Int32Array(n);

    const P = league.points;
    const npend = pending.length;
    const pairMapBase = buildPairResults(playedMatches);

    for (let it = 0; it < iterations; it++) {
      points.set(base.points);
      gf.set(base.gf); ga.set(base.ga); wins.set(base.wins); playedCnt.set(base.played);

      // 采样全部剩余比赛
      const simMatches = playedMatches.slice();
      for (let k = 0; k < npend; k++) {
        const f = pending[k];
        let hg, ag;
        if (f.fixed) { hg = f.hg; ag = f.ag; }
        else {
          hg = sampleGoals(f.cdfH, rng());
          ag = sampleGoals(f.cdfA, rng());
        }
        const h = f.homeIndex, a = f.awayIndex;
        playedCnt[h]++; playedCnt[a]++;
        gf[h] += hg; ga[h] += ag; gf[a] += ag; ga[a] += hg;
        if (hg > ag) { wins[h]++; points[h] += P.win; points[a] += P.loss; }
        else if (hg === ag) { points[h] += P.draw; points[a] += P.draw; }
        else { wins[a]++; points[a] += P.win; points[h] += P.loss; }
        simMatches.push({ homeIndex: h, awayIndex: a, homeGoals: hg, awayGoals: ag, played: true });
      }

      const stats = {
        played: playedCnt, wins,
        draws: null, losses: null,
        gf, ga, points
      };

      // 排名：常见配置走标量快路径
      let order;
      const fast = isSimpleTiebreak(league.tiebreak);
      if (fast) {
        const idx = new Array(n);
        for (let i = 0; i < n; i++) idx[i] = i;
        const gd = new Float64Array(n);
        for (let i = 0; i < n; i++) gd[i] = gf[i] - ga[i];
        idx.sort((x, y) =>
          (points[y] - points[x]) ||
          (gd[y] - gd[x]) ||
          (gf[y] - gf[x]) ||
          (wins[y] - wins[x]) ||
          (x - y));
        order = idx;
      } else {
        const pairMap = npend === 0 ? pairMapBase : buildPairResults(simMatches);
        order = rankTeams(stats, league, pairMap, simMatches, null);
      }

      for (let pos = 0; pos < n; pos++) {
        const t = order[pos];
        positionCounts[t][pos + 1] += 1;
        pointsSum[t] += points[t];
        posSum[t] += pos + 1;
      }
    }

    /* ---------------- 结果整理 ---------------- */
    const teamResults = league.teams.map(t => {
      const i = t.index;
      const byPosition = new Float64Array(n + 1);
      for (let p = 1; p <= n; p++) byPosition[p] = positionCounts[i][p] / iterations;

      const slotProbs = {};
      for (const s of league.slots) {
        let acc = 0;
        for (let p = s.from; p <= s.to; p++) acc += byPosition[p];
        slotProbs[s.type] = (slotProbs[s.type] || 0) + acc;
      }

      const topK = new Float64Array(n + 1);
      let run = 0;
      for (let p = 1; p <= n; p++) { run += byPosition[p]; topK[p] = run; }

      return {
        id: t.id,
        name: t.name,
        expectedPoints: pointsSum[i] / iterations,
        expectedPosition: posSum[i] / iterations,
        positions: byPosition,
        topK,
        slots: slotProbs,
        mostLikelyPosition: argmaxPosition(byPosition),
        titleProbability: slotProbs.title || 0,
        relegationProbability: slotProbs.relegation || 0
      };
    });

    const byExpectedPosition = teamResults.slice()
      .sort((a, b) => a.expectedPosition - b.expectedPosition);

    // 每支球队的"最可能最终名次"汇总，用于展示一张预测积分榜
    const projectedTable = byExpectedPosition.map((r, i) => ({
      rank: i + 1,
      id: r.id,
      name: r.name,
      expectedPoints: r.expectedPoints,
      expectedPosition: r.expectedPosition,
      slots: r.slots
    }));

    return {
      version: VERSION,
      league: { id: league.id, name: league.name, season: league.season },
      iterations,
      seed: o.seed != null ? o.seed : 'soccer-engine-v1',
      asOfRound,
      model: {
        globalAvg: model.globalAvg,
        homeAdvantage: model.homeAdv,
        attack: league.teams.map(t => ({ id: t.id, name: t.name, attack: model.attack[t.index], defence: model.defence[t.index] })),
        playedMatches: model.totalMatches
      },
      currentTable: buildCurrentTable(league, base, model),
      slots: league.slots,
      teams: teamResults,
      projectedTable
    };
  }

  function isSimpleTiebreak(rules) {
    // 只由 points/gd/gf/wins 构成且顺序一致时，可用标量比较
    const allowed = ['points', 'gd', 'gf', 'wins'];
    const norm = rules.filter(r => allowed.indexOf(r) >= 0);
    if (norm.length !== rules.length) return false;
    for (let i = 0; i < norm.length; i++) if (norm[i] !== allowed[i]) return false;
    return true;
  }

  function argmaxPosition(arr) {
    let best = 1, bv = arr[1];
    for (let p = 2; p < arr.length; p++) if (arr[p] > bv) { bv = arr[p]; best = p; }
    return best;
  }

  function buildCurrentTable(league, stats, model) {
    const pairMap = buildPairResults(league.matches.filter(m => m.played));
    const order = rankTeams(
      { played: stats.played, wins: stats.wins, draws: stats.draws, losses: stats.losses, gf: stats.gf, ga: stats.ga, points: stats.points },
      league, pairMap, league.matches.filter(m => m.played), null);
    const rows = order.map((i, pos) => {
      const t = league.teams[i];
      return {
        rank: pos + 1,
        id: t.id,
        name: t.name,
        played: stats.played[i],
        wins: stats.wins[i],
        draws: stats.draws[i],
        losses: stats.losses[i],
        gf: stats.gf[i],
        ga: stats.ga[i],
        gd: stats.gf[i] - stats.ga[i],
        points: stats.points[i]
      };
    });
    void model;
    return rows;
  }

  /* ------------------------------------------------------------------ *
   * 理论边界：最多/最少可能积分，以及"已锁定/已出局"
   * ------------------------------------------------------------------ */
  function theoreticalBounds(league, opts) {
    const o = opts || {};
    const asOfRound = o.asOfRound != null ? Number(o.asOfRound) : null;
    const stats = computeStats(league, { asOfRound });
    const pend = remainingMatches(league, { asOfRound });
    const n = league.teams.length;
    const P = league.points;

    const maxPts = new Float64Array(n);
    const minPts = new Float64Array(n);
    for (let i = 0; i < n; i++) { maxPts[i] = stats.points[i]; minPts[i] = stats.points[i]; }
    for (const m of pend) {
      maxPts[m.homeIndex] += P.win; maxPts[m.awayIndex] += P.win;
      minPts[m.homeIndex] += P.loss; minPts[m.awayIndex] += P.loss;
    }

    // 名次区间上下界
    //   若 minPts[j] > maxPts[i]，j 必然排在本队之前（积分绝对领先，无视净胜球）
    //   若 maxPts[j] < minPts[i]，j 必然排在本队之后
    //   积分可能持平时不判定为"必然"，因此界是保守（偏宽）的，但绝不会错报"已锁定"。
    const slotBounds = league.teams.map(t => {
      const i = t.index;
      let mustBeAbove = 0;
      let mustBeBelow = 0;
      let couldBeAbove = 0;
      for (let j = 0; j < n; j++) {
        if (j === i) continue;
        if (minPts[j] > maxPts[i]) mustBeAbove++;
        if (maxPts[j] < minPts[i]) mustBeBelow++;
        if (maxPts[j] >= minPts[i]) couldBeAbove++;
      }
      const n2 = n;
      const bestPos = Math.min(mustBeAbove + 1, n2);
      let worstPos = Math.max(n2 - mustBeBelow, bestPos);

      // 用"可超越者"给一个更贴近实际的期望名次上限
      const optimisticPos = Math.min(couldBeAbove + 1, n2);

      // 若某队 maxPts 严格大于所有对手 maxPts，且它能靠积分锁定名次，则冠军也锁定。
      // 这里先按"最坏名次"判断区间，再单独检查"积分上无人能及"。
      let dominatedRivals = 0;
      for (let j = 0; j < n; j++) {
        if (j !== i && maxPts[i] > maxPts[j]) dominatedRivals++;
      }
      if (dominatedRivals === n - 1) worstPos = 1;

      const secured = league.slots.filter(s => worstPos <= s.to && bestPos >= s.from).map(s => s.type);
      const eliminated = league.slots.filter(s => bestPos > s.to || worstPos < s.from).map(s => s.type);

      return {
        id: t.id,
        name: t.name,
        currentPoints: stats.points[i],
        maxPoints: maxPts[i],
        minPoints: minPts[i],
        bestPossiblePosition: bestPos,
        worstPossiblePosition: worstPos,
        optimisticPosition: optimisticPos,
        guaranteed: secured,
        eliminated
      };
    });

    return {
      asOfRound,
      remainingMatches: pend.length,
      teams: slotBounds,
      relaxed: true,
      note: '乐观/悲观界是独立的极值估计（忽略对手之间互相抢分），用于快速判定；精确判定请用 eliminate()。'
    };
  }

  /**
   * 精确判定：给定球队与名次阈值 k，穷举剩余比赛结果，
   * 判断是否存在"该队最终排名 <= k"的情形（canReach）与 ">= k" 的情形。
   * 仅在 3^remaining <= maxNodes 时穷举，否则退回松弛界并标注。
   */
  function eliminate(league, opts) {
    const o = opts || {};
    const teamId = String(o.team);
    const k = Number(o.position || 1);
    const maxNodes = o.maxNodes || 200000;
    const asOfRound = o.asOfRound != null ? Number(o.asOfRound) : null;
    const team = league.teamById.get(teamId);
    if (!team) throw new Error('unknown team: ' + teamId);

    const pend = remainingMatches(league, { asOfRound });
    const n = league.teams.length;
    const stats = computeStats(league, { asOfRound });

    const combos = Math.pow(3, pend.length);
    if (combos > maxNodes) {
      const b = theoreticalBounds(league, { asOfRound });
      const row = b.teams.find(t => t.id === teamId);
      return {
        exact: false,
        reason: 'too many combinations (' + combos.toExponential(1) + ' > ' + maxNodes + ')',
        team: teamId, position: k,
        canReach: row.bestPossiblePosition <= k,
        alreadySecured: row.worstPossiblePosition <= k,
        bounds: { best: row.bestPossiblePosition, worst: row.worstPossiblePosition }
      };
    }

    // 迭代枚举 3^m 种结果
    const m = pend.length;
    const P = league.points;
    let canReach = false, canMiss = false;

    const idxs = new Int32Array(m);
    for (let i = 0; i < m; i++) idxs[i] = 0;

    const basePts = Float64Array.from(stats.points);
    const baseGf = Int32Array.from(stats.gf);
    const baseGa = Int32Array.from(stats.ga);

    for (let code = 0; code < combos; code++) {
      // 解码 3 进制
      let c = code;
      for (let i = 0; i < m; i++) { idxs[i] = c % 3; c = (c / 3) | 0; }

      const pts = Float64Array.from(basePts);
      const gd = new Int32Array(n);
      for (let i = 0; i < n; i++) gd[i] = baseGf[i] - baseGa[i];

      for (let i = 0; i < m; i++) {
        const mt = pend[i];
        const r = idxs[i];
        if (r === 0) { // 主胜
          pts[mt.homeIndex] += P.win; pts[mt.awayIndex] += P.loss;
          gd[mt.homeIndex] += 1; gd[mt.awayIndex] -= 1;
        } else if (r === 1) { // 平
          pts[mt.homeIndex] += P.draw; pts[mt.awayIndex] += P.draw;
        } else { // 客胜
          pts[mt.awayIndex] += P.win; pts[mt.homeIndex] += P.loss;
          gd[mt.awayIndex] += 1; gd[mt.homeIndex] -= 1;
        }
      }

/** 把注入的自定义联赛补进目录（已存在的 key 不覆盖） */
function collectLeagues() {
  const out = BUILTIN_LEAGUES.slice();
  const known = new Set(out.map(l => l.key));
  const bag = window.SOCCER_DATA || {};
  for (const key of Object.keys(bag)) {
    if (known.has(key)) continue;
    const L = bag[key];
    if (!L || !Array.isArray(L.teams) || !Array.isArray(L.matches)) continue;
    const teams = L.teams.length;
    const slots = Array.isArray(L.slots) && L.slots.length
      ? L.slots.map(x => x.label).join(' / ')
      : '自动';
    out.push({
      key,
      name: (L.name || key) + (L.season ? ' ' + L.season : '') + '（自定义）',
      file: null,
      cid: null,
      season: L.season || '',
      custom: true,
      _slotsDesc: slots,
      _teams: teams
    });
    known.add(key);
  }
  return out;
}

const LEAGUES = collectLeagues();

    }

  };

})();

const THEMES = ['auto', 'dark', 'light'];
const THEME_META = {
  auto:  { ico: '◐', lbl: '自动' },
  dark:  { ico: '🌙', lbl: '夜间' },
  light: { ico: '☀️', lbl: '日间' }
};
const THEME_KEY = 'soccer-probability-theme';

function applyTheme(t) {
  if (THEMES.indexOf(t) < 0) t = 'auto';
  document.documentElement.setAttribute('data-theme', t);
  const m = THEME_META[t];
  const icoEl = document.getElementById('themeIco');
  const lblEl = document.getElementById('themeLbl');
  if (icoEl) icoEl.textContent = m.ico;
  if (lblEl) lblEl.textContent = m.lbl;
  const btn = document.getElementById('themeBtn');
  if (btn) btn.setAttribute('title', '当前：' + m.lbl + '（点击切换 自动 → 夜间 → 日间）');
}

function readStoredTheme() {
  // URL 参数优先（?theme=dark），便于分享与截图
  try {
    const q = new URLSearchParams(location.search).get('theme');
    if (THEMES.indexOf(q) >= 0) return q;
  } catch (e) {}
  try {
    const v = localStorage.getItem(THEME_KEY);
    return THEMES.indexOf(v) >= 0 ? v : 'auto';
  } catch (e) { return 'auto'; }
}

(function initTheme() {
  applyTheme(readStoredTheme());
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'auto';
    const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });
})();

let state = {
  league: null,     // 原始 JSON
  norm: null,       // normalizeLeague 结果
  maxRound: null,
  whatIfs: []
};

/* ---------------- 数据加载 ---------------- */
// 构建时会把数据内联到 window.SOCCER_DATA；file:// 下无法 fetch，必须走内联。
function bundledData(key) {
  const bag = window.SOCCER_DATA;
  if (bag && bag[key]) return bag[key];
  return null;
}

async function loadBundled(key) {
  const inline = bundledData(key);
  if (inline) return inline;

  const l = LEAGUES.find(x => x.key === key);
  if (!l) throw new Error('未知联赛 ' + key);
  if (!l.file) throw new Error('自定义联赛 ' + key + ' 的数据未内联，请确认它已放入 data/ 并重新构建');
  let res;
  try {
    res = await fetch(l.file, { cache: 'no-store' });
  } catch (e) {
    throw new Error('读取 ' + l.file + ' 失败（请使用构建产物 dist/index.html，它已内联数据）');
  }
  if (!res.ok) throw new Error('找不到快照 ' + l.file + '（' + res.status + '）');
  return await res.json();
}

/* ---------------- 最新数据（在线抓取） ----------------
 * 目标是拿到"比构建时更新鲜"的数据。浏览器直连 dongqiudi.com 会被同源策略拦截，
 * 而公共 CORS 代理实测普遍不可用（allorigins 522 / corsproxy 403 / codetabs 522 / cors.lol 429）。
 *
 * 因此按以下顺序取数：
 *   1) window.SOCCER_PROXY  —— 自建代理（本地 node bin/serve.js），可直连源站
 *   2) jsDelivr 仓库快照    —— GitHub Actions 定时抓取后提交，天然带 CORS
 *   3) raw.githubusercontent —— 同上，兜底
 * 全部失败时由调用方回退到内联快照，保证页面永远可用。
 */
const REPO = { owner: '22ABLE22', name: 'soccer-probability', branch: 'main' };

const DATA_CHANNELS = [
  {
    label: 'jsDelivr 快照',
    url: file => 'https://cdn.jsdelivr.net/gh/' + REPO.owner + '/' + REPO.name +
      '@' + REPO.branch + '/' + file
  },
  {
    label: 'GitHub raw 快照',
    url: file => 'https://raw.githubusercontent.com/' + REPO.owner + '/' + REPO.name +
      '/' + REPO.branch + '/' + file
  }
];

async function fetchJsonWithTimeout(url, ms) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

/** 取一份"最新" league JSON；失败抛错，由调用方决定是否回退 */
async function loadLive(key, onProgress) {
  const l = LEAGUES.find(x => x.key === key);
  if (!l) throw new Error('未知联赛 ' + key);
  if (!l.file) {
    // 自定义联赛没有在线源，直接用内联数据
    if (onProgress) onProgress('自定义联赛（本地数据）');
    const j = await loadBundled(key);
    j.meta = Object.assign({}, j.meta, { via: '自定义联赛（本地数据）' });
    return j;
  }
  const errors = [];

  if (window.SOCCER_PROXY) {
    try {
      if (onProgress) onProgress('自建代理');
      const j = await fetchJsonWithTimeout(
        window.SOCCER_PROXY + '/api/league?league=' + encodeURIComponent(key), 30000);
      if (!j || !j.teams || !j.matches) throw new Error('返回格式不对');
      j.meta = Object.assign({}, j.meta, { via: '自建代理（源站实时）' });
      return j;
    } catch (e) {
      errors.push('自建代理: ' + (e && e.message ? e.message : e));
    }
  }

  for (const ch of DATA_CHANNELS) {
    try {
      if (onProgress) onProgress(ch.label);
      const j = await fetchJsonWithTimeout(ch.url(l.file), 15000);
      if (!j || !j.teams || !j.matches) throw new Error('返回格式不对');
      j.meta = Object.assign({}, j.meta, { via: ch.label });
      return j;
    } catch (e) {
      errors.push(ch.label + ': ' + (e && e.message ? e.message : e));
    }
  }

  throw new Error('获取最新数据失败：\n' + errors.join('\n'));
}

/** 数据新鲜度说明；超过 48 小时会明确标注"数据可能不是最新" */
function freshnessNote(league) {
  const via = (league.meta && league.meta.via) || '内置快照';
  const at = league.meta && league.meta.fetchedAt;
  const played = league.matches.filter(m => m.played).length;
  let s = '来源：' + via;

  let stale = false;
  if (at) {
    const d = new Date(at);
    if (!isNaN(d.getTime())) {
      s += ' · 抓取于 ' + d.toLocaleString('zh-CN', { hour12: false });
      const hours = (Date.now() - d.getTime()) / 3600000;
      if (hours > 48) {
        stale = true;
        s += '（' + Math.floor(hours / 24) + ' 天前，可能不是最新）';
      }
    }
  } else {
    stale = true;
    s += '（无抓取时间，可能不是最新）';
  }

  s += ' · 已赛 ' + played + '/' + league.matches.length + ' 场';
  return { text: s, stale };
}

/* ---------------- 轮次下拉 ---------------- */
function resetRoundSelect() {
  const sel = document.getElementById('roundSel');
  sel.innerHTML = '';
  const o = document.createElement('option');
  o.value = '';
  o.textContent = '— 先选联赛 —';
  sel.appendChild(o);
  sel.value = '';
  sel.disabled = true;
}

function rebuildRounds(league) {
  const rs = Array.from(new Set(league.matches.map(m => m.round).filter(x => x != null)))
    .sort((a, b) => a - b);
  const sel = document.getElementById('roundSel');
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = '';
  optAll.textContent = '全部（当前真实进度）';
  sel.appendChild(optAll);
  for (const r of rs) {
    const o = document.createElement('option');
    o.value = r;
    o.textContent = '第 ' + r + ' 轮';
    sel.appendChild(o);
  }
  sel.value = '';
  sel.disabled = false;
  return rs.length ? rs[rs.length - 1] : null;
}

/* ---------------- what-if 编辑 ---------------- */
function renderWhatIfs() {
  const box = document.getElementById('whatifList');
  box.innerHTML = '';
  if (!state.whatIfs.length) {
    box.innerHTML = '<div class="hint" style="padding:0">还没有添加。点击上方「+ what-if」添加一条。</div>';
    return;
  }
  const teams = state.league ? state.league.teams.map(t => t.name) : [];
  state.whatIfs.forEach((wf, i) => {
    const row = document.createElement('div');
    row.className = 'wf';

    const home = document.createElement('select');
    const away = document.createElement('select');
    for (const t of teams) {
      home.appendChild(new Option(t, t));
      away.appendChild(new Option(t, t));
    }
    home.value = wf.home; away.value = wf.away;

    const hg = document.createElement('input');
    hg.type = 'number'; hg.min = 0; hg.max = 15; hg.value = wf.hg; hg.style.width = '60px';
    const ag = document.createElement('input');
    ag.type = 'number'; ag.min = 0; ag.max = 15; ag.value = wf.ag; ag.style.width = '60px';

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '删除';
    del.onclick = () => { state.whatIfs.splice(i, 1); renderWhatIfs(); };

    home.onchange = () => { wf.home = home.value; };
    away.onchange = () => { wf.away = away.value; };
    hg.oninput = () => { wf.hg = Number(hg.value); };
    ag.oninput = () => { wf.ag = Number(ag.value); };

    row.append(home, hg, ag, away, del);
    box.appendChild(row);
  });
}

document.getElementById('addWfBtn').onclick = () => {
  if (!state.league) { alert('请先加载一个联赛'); return; }
  const names = state.league.teams.map(t => t.name);
  state.whatIfs.push({ home: names[0], away: names[1] || names[0], hg: 1, ag: 0 });
  document.getElementById('wfCard').style.display = '';
  renderWhatIfs();
};

/* ---------------- 渲染 ---------------- */
function pct(x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; }
function heatClass(p) {
  if (p >= 0.5) return 'p-high';
  if (p >= 0.05) return 'p-mid';
  if (p > 0) return 'p-low';
  return 'p-zero';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderCurrentTable(rows, meta) {
  document.getElementById('tableMeta').textContent = meta;
  const t = document.getElementById('curTable');
  let html = '<thead><tr><th>#</th><th class="name">球队</th><th>赛</th><th>胜</th><th>平</th>' +
    '<th>负</th><th>进/失</th><th>净胜</th><th>积分</th></tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr><td><span class="rank">' + r.rank + '</span></td>' +
      '<td class="name">' + esc(r.name) + '</td>' +
      '<td>' + r.played + '</td><td>' + r.wins + '</td><td>' + r.draws + '</td>' +
      '<td>' + r.losses + '</td><td>' + r.gf + '/' + r.ga + '</td>' +
      '<td>' + (r.gd > 0 ? '+' : '') + r.gd + '</td>' +
      '<td><b>' + r.points + '</b></td></tr>';
  }
  t.innerHTML = html + '</tbody>';
}

function renderProbTable(res, slots) {
  const types = [];
  for (const s of slots) if (types.indexOf(s.type) < 0) types.push(s.type);

  document.getElementById('probMeta').textContent =
    res.iterations.toLocaleString() + ' 次模拟' +
    (res.asOfRound != null ? ' · 截至第 ' + res.asOfRound + ' 轮' : '');

  const t = document.getElementById('probTable');
  let html = '<thead><tr><th>#</th><th class="name">球队</th><th>期望分</th><th>期望名次</th>' +
    '<th>最可能名次</th>';
  for (const type of types) {
    const s = slots.find(x => x.type === type);
    html += '<th>' + esc(s.label || type) + '</th>';
  }
  html += '</tr></thead><tbody>';

  const ordered = res.projectedTable.map(p => res.teams.find(x => x.id === p.id));
  ordered.forEach((tm, i) => {
    html += '<tr><td><span class="rank">' + (i + 1) + '</span></td>' +
      '<td class="name">' + esc(tm.name) + '</td>' +
      '<td>' + tm.expectedPoints.toFixed(1) + '</td>' +
      '<td>' + tm.expectedPosition.toFixed(2) + '</td>' +
      '<td>' + tm.mostLikelyPosition + '</td>';
    for (const type of types) {
      const p = tm.slots[type] || 0;
      html += '<td class="bar-cell">' +
        '<div class="fill" style="width:' + Math.max(0, Math.min(100, p * 100)) + '%;background:' +
        (p >= 0.5 ? 'var(--green)' : p >= 0.05 ? 'var(--yellow)' : 'var(--accent)') + '"></div>' +
        '<span class="v ' + heatClass(p) + '">' + pct(p) + '</span></td>';
    }
    html += '</tr>';
  });
  t.innerHTML = html + '</tbody>';
}

function renderPositionTable(res) {
  const t = document.getElementById('posTable');
  const top = res.teams.slice().sort((a, b) => a.expectedPosition - b.expectedPosition).slice(0, 8);
  let html = '<thead><tr><th class="name">球队</th>';
  for (let p = 1; p <= 8; p++) html += '<th>' + p + '</th>';
  html += '</tr></thead><tbody>';
  for (const tm of top) {
    html += '<tr><td class="name">' + esc(tm.name) + '</td>';
    for (let p = 1; p <= 8; p++) {
      const v = tm.positions[p] || 0;
      const alpha = Math.min(1, v * 1.6);
      html += '<td style="background:rgba(62,166,255,' + (alpha * 0.45).toFixed(3) + ')">' +
        (v >= 0.005 ? (v * 100).toFixed(0) + '%' : '·') + '</td>';
    }
    html += '</tr>';
  }
  t.innerHTML = html + '</tbody>';
}

function renderModel(res) {
  const m = res.model;
  const lines = [
    '联赛场均进球（每队）：<b>' + m.globalAvg.toFixed(3) + '</b>',
    '主场系数：<b>' + m.homeAdvantage.toFixed(3) + '</b>（客场 ' + (1 / m.homeAdvantage).toFixed(3) + '）',
    '用于估计参数的已赛比赛：<b>' + m.playedMatches + '</b> 场',
    '随机种子：<code>' + esc(String(res.seed)) + '</code>',
    ''
  ];
  const sorted = m.attack.slice().sort((a, b) => (b.attack / b.defence) - (a.attack / a.defence)).slice(0, 6);
  lines.push('<b>实力指数前 6</b>（攻/防之比）');
  for (const a of sorted) {
    lines.push('&nbsp;&nbsp;' + esc(a.name) + '：攻 ' + a.attack.toFixed(2) + ' / 防 ' + a.defence.toFixed(2));
  }
  document.getElementById('modelInfo').innerHTML = lines.join('<br>');
}

/* ---------------- 主流程 ---------------- */
async function run() {
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const key = document.getElementById('leagueSel').value;

  if (!key) {
    status.className = 'hint empty';
    status.style.display = '';
    status.textContent = '请先在上方「联赛」中选择一个联赛，再点击「开始计算」。';
    document.getElementById('out').style.display = 'none';
    const dn = document.getElementById('dataNote');
    if (dn) dn.style.display = 'none';
    return;
  }

  btn.disabled = true;
  status.className = 'hint empty';
  status.style.display = '';
  status.innerHTML = '<span class="spin"></span> 正在加载数据…';
  document.getElementById('out').style.display = 'none';

  try {
    const src = document.getElementById('srcSel').value;

    // 只要联赛或数据源与上次不同，就重新加载。
    // 注意 state.leagueKey 必须与 key 严格比较，二者任一改变都要重取。
    const needReload = !state.league || state.leagueKey !== key || state.srcKey !== src;
    if (needReload) {
      if (src === 'live') {
        try {
          state.league = await loadLive(key, label => {
            status.innerHTML = '<span class="spin"></span> 正在获取最新数据（' + label + '）…';
          });
        } catch (e) {
          // 在线失败时回退到内置快照，但仍然可用
          state.league = await loadBundled(key);
          state.league.meta = Object.assign({}, state.league.meta, {
            via: '内置快照（在线获取失败，已回退）',
            liveError: String(e && e.message ? e.message : e)
          });
        }
      } else {
        state.league = await loadBundled(key);
      }
      state.leagueKey = key;
      state.srcKey = src;
      state.maxRound = rebuildRounds(state.league);
      renderWhatIfs();
    }
    const roundSel = document.getElementById('roundSel');
    const asOfRound = roundSel.value === '' ? null : Number(roundSel.value);
    const iterations = Number(document.getElementById('iterSel').value);

    status.innerHTML = '<span class="spin"></span> 正在模拟 ' + iterations.toLocaleString() + ' 次…';
    await new Promise(r => setTimeout(r, 16));   // 让 UI 先刷新

    const norm = E.normalizeLeague(state.league);

    const whatIf = state.whatIfs.map(w => ({
      home: w.home, away: w.away, homeGoals: w.hg, awayGoals: w.ag
    }));

    const t0 = performance.now();
    const res = E.simulate(norm, {
      iterations,
      asOfRound,
      whatIf,
      seed: 'web-' + key + '-' + (asOfRound == null ? 'all' : asOfRound) + '-' + whatIf.length
    });
    const ms = performance.now() - t0;

    renderCurrentTable(res.currentTable, asOfRound == null
      ? '当前真实进度'
      : '截至第 ' + asOfRound + ' 轮');
    renderProbTable(res, norm.slots);
    renderPositionTable(res);
    renderModel(res);

    document.getElementById('probHint').innerHTML = whatIf.length
      ? '已应用 ' + whatIf.length + ' 条 what-if 指定结果。'
      : '概率为 ' + iterations.toLocaleString() + ' 次模拟的频率估计，标准误约 ±' +
        (50 / Math.sqrt(iterations)).toFixed(2) + ' 个百分点（p=0.5 时最坏）。耗时 ' + ms.toFixed(0) + ' ms。';

    // 数据新鲜度（来源 / 抓取时间 / 已完成场次）
    const noteEl = document.getElementById('dataNote');
    if (noteEl) {
      const fr = freshnessNote(state.league);
      noteEl.textContent = fr.text;
      noteEl.className = 'hint' + (fr.stale ? ' warn' : '');
      noteEl.title = (state.league.meta && state.league.meta.liveError) || '';
      noteEl.style.display = '';
    }

    status.style.display = 'none';
    document.getElementById('out').style.display = '';
  } catch (e) {
    status.className = 'err';
    status.textContent = '出错了：' + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('runBtn').onclick = run;

/** 选联赛后立刻把数据准备好（填充轮次下拉），但不跑模拟 */
async function prepareLeague() {
  const key = leagueSel.value;
  const status = document.getElementById('status');

  state.league = null;
  state.leagueKey = null;

  if (!key) {
    resetRoundSelect();
    status.className = 'hint empty';
    status.style.display = '';
    status.textContent = '请先在上方「联赛」中选择一个联赛，再点击「开始计算」。';
    document.getElementById('out').style.display = 'none';
    const dn = document.getElementById('dataNote');
    if (dn) dn.style.display = 'none';
    return;
  }

  status.className = 'hint empty';
  status.style.display = '';
  status.innerHTML = '<span class="spin"></span> 正在准备数据…';

  try {
    const src = document.getElementById('srcSel').value;
    if (src === 'live') {
      try {
        state.league = await loadLive(key, label => {
          status.innerHTML = '<span class="spin"></span> 正在获取最新数据（' + label + '）…';
        });
      } catch (e) {
        state.league = await loadBundled(key);
        state.league.meta = Object.assign({}, state.league.meta, {
          via: '内置快照（在线获取失败，已回退）',
          liveError: String(e && e.message ? e.message : e)
        });
      }
    } else {
      state.league = await loadBundled(key);
    }
    state.leagueKey = key;
    state.srcKey = src;
    state.maxRound = rebuildRounds(state.league);
    renderWhatIfs();

    status.className = 'hint empty';
    status.textContent = '已就绪：' + state.league.name +
      (state.league.meta && state.league.meta.season ? ' ' + state.league.meta.season : '') +
      '（' + state.league.teams.length + ' 队，共 ' + state.maxRound + ' 轮）。'
      + '可以选择「截至轮次」后点击「开始计算」。';
  } catch (e) {
    status.className = 'err';
    status.textContent = '加载失败：' + (e && e.message ? e.message : e);
  }
}

leagueSel.onchange = prepareLeague;
document.getElementById('srcSel').onchange = () => {
  state.league = null;
  state.leagueKey = null;
  if (leagueSel.value) prepareLeague();
};

// 默认不自动计算：等待用户选择联赛
(function initPrompt() {
  resetRoundSelect();
  const status = document.getElementById('status');
  status.className = 'hint empty';
  status.style.display = '';
  status.textContent = '请先在上方「联赛」中选择一个联赛，再点击「开始计算」。';
  document.getElementById('out').style.display = 'none';
})();
