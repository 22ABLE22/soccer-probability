name: Refresh league data

# 每天抓取一次最新赛果并提交回仓库。
# GitHub Pages 上的「获取数据」读的就是这些快照。
on:
  schedule:
    # UTC 20:10 = 北京 04:10，此时当天所有比赛都已结束
    - cron: '10 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # 需要它才能在提交后主动触发 deploy

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # 让 Node 与 shell 都按 UTF-8 输出，避免日志中文乱码
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建时用 git log 取手工录入联赛的最后提交时间，浅克隆取不到
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 抓取失败不中断，先跑完拿到完整结果；最后一步再决定是否报红
      - name: Fetch all leagues
        id: fetch
        continue-on-error: true
        run: node bin/fetch-all.js

      # 若上一轮有联赛失败（通常是懂球帝限流），隔几分钟再补一次
      - name: Retry failed leagues
        id: fetch2
        if: steps.fetch.outcome != 'success'
        continue-on-error: true
        run: |
          echo "首轮抓取有失败，等待 90 秒后重试…"
          sleep 90
          node bin/fetch-all.js

      - name: Rebuild static site
        run: node bin/build.js

      - name: Sanity check
        run: node tests/test-engine.js

      # 数据完整性：结构、比分一致性、每轮场次、新鲜度
      # 失败不阻断提交（好数据仍要落地），但会在最后一步报红
      - name: Data integrity check
        id: data
        continue-on-error: true
        run: node tests/test-data.js --max-days 2

      # 即使部分联赛失败，也把已成功的数据提交上去
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 自动刷新联赛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 关键：用 GITHUB_TOKEN 推送的提交不会触发其他 workflow（GitHub 防止递归的机制），
      # 所以必须显式触发一次 Deploy，否则 bot 提交的数据不会部署到 Pages。
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "数据已更新，触发 Pages 部署…"
          gh workflow run deploy.yml --ref main
          sleep 10
          gh run list --workflow=deploy.yml --limit 1

      # 关键：把抓取失败 / 数据异常暴露成红色，而不是静默成功。
      # fetch2 只在首轮失败时运行；若补抓成功则视为恢复，不再报红。
      - name: Report result
        if: >-
          steps.data.outcome != 'success' ||
          (steps.fetch.outcome != 'success' && steps.fetch2.outcome != 'success')
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ] && [ "${{ steps.fetch2.outcome }}" != "success" ]; then
            echo "::error::联赛抓取失败（首轮与补抓均未成功），详见「Fetch all leagues」日志；失败联赛保留旧数据"
          fi
          if [ "${{ steps.data.outcome }}" != "success" ]; then
            echo "::error::数据完整性检查未通过，详见「Data integrity check」日志"
          fi
          exit 1
