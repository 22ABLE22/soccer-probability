name: Refresh league data

# 每天抓取一次最新赛果并提交回仓库。
# GitHub Pages 上的「获取数据」读的就是这些快照。
on:
  schedule:
    # UTC 20:10 = 北京 04:10，此时当天所有比赛都已结束
    - cron: '10 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch all leagues
        run: node bin/fetch-all.js

      - name: Rebuild static site
        run: node bin/build.js

      - name: Sanity check
        run: node tests/test-engine.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动刷新联赛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
