name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建时用 git log 取手工录入联赛的最后提交时间，浅克隆取不到
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 手动推送代码时顺带刷新一次数据；由定时刷新任务（refresh-data）派发的部署
      # 已经带着刚抓好的数据，无需再抓——避免同一天对上游重复请求，加重反爬。
      - name: Refresh league snapshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: node bin/fetch-all.js

      - name: Build static site
        run: node bin/build.js

      - name: Verify engine tests
        run: node tests/test-engine.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
